<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loquendon't Web</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0a0a0a; color: #00ff41; padding: 40px; max-width: 800px; margin: auto; }
        textarea { width: 100%; height: 200px; background: #111; color: #00ff41; border: 1px solid #00ff41; padding: 10px; font-size: 14px; outline: none; }
        .controls { margin-top: 20px; display: flex; align-items: center; gap: 20px; }
        button { padding: 15px 30px; border: 2px solid #00ff41; background: #000; color: #00ff41; font-weight: bold; cursor: pointer; }
        button:hover { background: #00ff41; color: #000; }
        button:disabled { border-color: #333; color: #333; cursor: wait; }
        #status { font-size: 14px; }
    </style>
</head>
<body>

    <h2>LOQUENDON'T // CLOUD_V1</h2>
    
    <textarea id="txt-input">/voice=en-US-AndrewNeural
Hello.
/pause=1000
This is a test of the synchronized files.</textarea>
    
    <div class="controls">
        <button id="run-btn" onclick="generate()">Generate & Download</button>
        <div id="status">READY</div>
    </div>

    <script>
        // CRITICAL: Replace 'your-service-name' with your actual Render URL name
        const RENDER_URL = "https://your-service-name.onrender.com/generate";

        function generate() {
            const btn = document.getElementById('run-btn');
            const status = document.getElementById('status');
            const text = document.getElementById('txt-input').value;

            btn.disabled = true;
            status.innerText = "PROCESSING (Wait for download)...";
            status.style.color = "#ffff00";

            // Open the download in a new tab/window to prevent "Not Found" screen
            const finalUrl = `${RENDER_URL}?text=${encodeURIComponent(text)}`;
            window.location.href = finalUrl;

            setTimeout(() => {
                btn.disabled = false;
                status.innerText = "READY";
                status.style.color = "#00ff41";
            }, 10000);
        }
    </script>
</body>
</html>
