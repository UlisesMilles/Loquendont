<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loquendon't // Cloud Interface</title>
    <style>
        :root { --glow: #00ff41; --bg: #0a0a0a; --panel: #111; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--glow); margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; padding: 30px; border-right: 1px solid #333; background: #0d0d0d; transition: 0.3s; overflow-y: auto; flex-shrink: 0; }
        .sidebar.hidden { width: 0; padding: 0; border: none; overflow: hidden; }
        .main-content { flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 20px; position: relative; min-width: 0; }
        h2 { border-bottom: 2px solid var(--glow); padding-bottom: 10px; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        .accent { color: #fff; font-weight: bold; background: #222; padding: 2px 5px; border-radius: 3px; }
        textarea { width: 100%; flex: 1; background: var(--panel); color: var(--glow); border: 1px solid #333; padding: 15px; font-size: 16px; outline: none; resize: none; box-sizing: border-box; }
        textarea:disabled { opacity: 0.5; }
        .toolbar { display: flex; gap: 15px; flex-wrap: wrap; background: #181818; padding: 15px; border-radius: 5px; align-items: center; border: 1px solid #333; }
        .setting-group { display: flex; align-items: center; gap: 8px; font-size: 12px; border-left: 1px solid #444; padding-left: 10px; }
        select, input { background: #000; color: var(--glow); border: 1px solid #444; padding: 8px; }
        button { padding: 10px 15px; background: #000; color: var(--glow); border: 1px solid var(--glow); cursor: pointer; font-family: inherit; font-weight: bold; text-transform: uppercase; font-size: 11px; }
        button:hover:not(:disabled) { background: var(--glow); color: #000; }
        button:disabled { opacity: 0.3; cursor: not-allowed; border-color: #444; color: #444; }
        button.primary { background: var(--glow); color: #000; padding: 15px 40px; font-size: 18px; }
        .status-bar { display: flex; align-items: center; justify-content: space-between; }
        #status { font-weight: bold; }
        .working { color: #ff0; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <h2>System Status</h2>
        <p>Automation: <span class="accent">ENABLED</span></p>
        <p>Punctuation stops and line breaks are processed automatically.</p>
        <hr style="border:0; border-top:1px solid #333; margin: 20px 0;">
        <div id="log-console" style="font-size: 10px; color: #666;">Ready for input...</div>
    </div>

    <div class="main-content">
        <h2>Audio Constructor</h2>
        
        <div class="toolbar" id="main-toolbar">
            <select id="voice-select"><option>Polling...</option></select>
            <button onclick="previewVoice()">Preview</button>
            <button onclick="insertVoice()">+ Voice Tag</button>

            <div class="setting-group">
                <span>Short Stop (ms):</span>
                <input type="number" id="short-p" value="350" style="width: 60px;">
                <span>Long Stop (ms):</span>
                <input type="number" id="long-p" value="850" style="width: 60px;">
            </div>
        </div>

        <textarea id="txt-input" placeholder="Type your script here..."></textarea>
        
        <div class="status-bar">
            <button class="primary" id="run-btn" onclick="generate()">Generate & Download</button>
            <div id="status">SYSTEM READY</div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://loquendont.onrender.com";

        async function loadVoices() {
            const select = document.getElementById('voice-select');
            try {
                const response = await fetch(`${BASE_URL}/voices`);
                const voices = await response.json();
                select.innerHTML = "";
                voices.sort((a, b) => a.Locale.localeCompare(b.Locale));
                voices.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.ShortName;
                    opt.textContent = `${v.FriendlyName}${v.IsMultilingual ? " [Multi]" : ""}`;
                    opt.setAttribute('data-lang', v.Language);
                    select.appendChild(opt);
                });
            } catch (err) { select.innerHTML = "<option>Error Connecting</option>"; }
        }

        function setUIBusy(busy) {
            const btn = document.getElementById('run-btn');
            const txt = document.getElementById('txt-input');
            const status = document.getElementById('status');
            const toolbar = document.getElementById('main-toolbar');

            if (busy) {
                btn.disabled = true;
                txt.disabled = true;
                status.innerText = "PROCESSING REQUEST...";
                status.className = "working";
                btn.innerText = "BUSY...";
            } else {
                btn.disabled = false;
                txt.disabled = false;
                status.innerText = "SYSTEM READY";
                status.className = "";
                btn.innerText = "Generate & Download";
            }
        }

        async function generate() {
            const text = document.getElementById('txt-input').value;
            if(!text.trim()) return;
            
            const shortP = document.getElementById('short-p').value;
            const longP = document.getElementById('long-p').value;
            
            setUIBusy(true);

            try {
                const url = `${BASE_URL}/generate?text=${encodeURIComponent(text)}&short_p=${shortP}&long_p=${longP}`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error("Server Error");

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = downloadUrl;
                a.download = `loquendont_${Date.now()}.mp3`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                
                document.getElementById('log-console').innerText = "Last task: Downloaded successfully.";
            } catch (err) {
                alert("Request failed. The server might be timing out or waking up.");
                document.getElementById('log-console').innerText = "Last task: ERROR.";
            } finally {
                setUIBusy(false);
            }
        }

        function insertVoice() {
            const v = document.getElementById('voice-select').value;
            const area = document.getElementById('txt-input');
            area.setRangeText(`\n/voice=${v}\n`, area.selectionStart, area.selectionEnd, 'end');
            area.focus();
        }

        async function previewVoice() {
            const select = document.getElementById('voice-select');
            const voice = select.value;
            const lang = select.selectedOptions[0].getAttribute('data-lang');
            new Audio(`${BASE_URL}/preview?voice=${voice}&lang=${lang}`).play();
        }

        loadVoices();
    </script>
</body>
</html>
