<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loquendon't // Cloud Interface</title>
    <style>
        :root { --glow: #00ff41; --bg: #0a0a0a; --panel: #111; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--glow); margin: 0; display: flex; height: 100vh; }
        
        .sidebar { width: 300px; padding: 30px; border-right: 1px solid #333; background: #0d0d0d; transition: 0.3s; overflow-y: auto; }
        .sidebar.hidden { width: 0; padding: 0; border: none; overflow: hidden; }
        
        .main-content { flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 20px; position: relative; }
        h2 { border-bottom: 2px solid var(--glow); padding-bottom: 10px; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        .accent { color: #fff; font-weight: bold; background: #222; padding: 2px 5px; border-radius: 3px; }

        textarea { width: 100%; flex: 1; background: var(--panel); color: var(--glow); border: 1px solid #333; padding: 15px; font-size: 16px; outline: none; resize: none; }
        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; background: #181818; padding: 15px; border-radius: 5px; }
        
        select, input { background: #000; color: var(--glow); border: 1px solid #444; padding: 8px; }
        button { padding: 10px 20px; background: #000; color: var(--glow); border: 1px solid var(--glow); cursor: pointer; font-family: inherit; font-weight: bold; text-transform: uppercase; }
        button:hover { background: var(--glow); color: #000; }
        button.primary { background: var(--glow); color: #000; padding: 15px 40px; font-size: 18px; }
        
        .toggle-btn { position: absolute; left: 10px; top: 10px; z-index: 10; font-size: 10px; padding: 5px; opacity: 0.5; }
        .toggle-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <button class="toggle-btn" onclick="toggleSidebar()">[ TOGGLE INFO ]</button>

    <div class="sidebar" id="sidebar">
        <h2>Quick Start</h2>
        <p>Welcome to the <span class="accent">Loquendon't</span> engine.</p>
        <ol>
            <li>Select a <span class="accent">Voice</span> and insert it.</li>
            <li>Type your text. Mix multiple voices if you want!</li>
            <li>Add <span class="accent">Pauses</span> to make it sound natural.</li>
            <li>Hit <span class="accent">Generate</span> and your file will auto-download.</li>
        </ol>
    </div>

    <div class="main-content">
        <h2>Audio Constructor</h2>
        
        <div class="toolbar">
            <select id="voice-select">
                <option value="en-US-AndrewNeural">Andrew (US - Male)</option>
                <option value="en-US-EmmaNeural">Emma (US - Female)</option>
                <option value="en-GB-SoniaNeural">Sonia (UK - Female)</option>
                <option value="en-GB-RyanNeural">Ryan (UK - Male)</option>
                <option value="es-MX-DaliaNeural">Dalia (MX - Female)</option>
                <option value="es-ES-AlvaroNeural">Alvaro (ES - Male)</option>
            </select>
            <button onclick="previewVoice()">Preview Voice</button>
            <button onclick="insertVoice()">Insert /voice=</button>

            <div style="width: 1px; background: #444; margin: 0 10px;"></div>

            <input type="number" id="pause-amt" value="1000" style="width: 70px;">
            <button onclick="insertPause()">Insert /pause=</button>
        </div>

        <textarea id="txt-input" placeholder="Type here..."></textarea>
        
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <button class="primary" id="run-btn" onclick="generate()">Generate & Download</button>
            <div id="status">SYSTEM READY</div>
        </div>
    </div>

    <script>
        // UPDATE THIS TO YOUR ACTUAL RENDER URL
        const RENDER_URL = "https://your-service-name.onrender.com/generate";

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        function insertVoice() {
            const v = document.getElementById('voice-select').value;
            const area = document.getElementById('txt-input');
            area.value += (area.value ? "\n" : "") + `/voice=${v}\n`;
        }

        function insertPause() {
            const ms = document.getElementById('pause-amt').value || 1000;
            const area = document.getElementById('txt-input');
            area.value += (area.value ? "\n" : "") + `/pause=${ms}\n`;
        }

        // ACCURATE PREVIEW: Hits your Render server for a small sample
        async function previewVoice() {
            const voice = document.getElementById('voice-select').value;
            const status = document.getElementById('status');
            status.innerText = "LOADING PREVIEW...";
            
            // We send a tiny request to your server just for the preview
            const previewUrl = `${RENDER_URL}?text=${encodeURIComponent('/voice=' + voice + ' This is a preview.')}`;
            
            const audio = new Audio(previewUrl);
            audio.play().then(() => {
                status.innerText = "PLAYING PREVIEW";
            }).catch(e => {
                status.innerText = "PREVIEW ERROR (Server waking up?)";
            });
        }

        function generate() {
            const text = document.getElementById('txt-input').value;
            if(!text.trim()) return;
            document.getElementById('status').innerText = "GENERATING FULL MP3...";
            window.location.assign(`${RENDER_URL}?text=${encodeURIComponent(text)}`);
        }
    </script>
</body>
</html>
